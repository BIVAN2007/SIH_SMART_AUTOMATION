version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adas
      POSTGRES_PASSWORD: adas_pw
      POSTGRES_DB: adas
    ports:
      - "5432:5432"
    volumes:
      - adas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://adas:adas_pw@db:5432/adas
    ports:
      - "8000:8000"

volumes:
  adas_pgdata:
